name: Verify LunaTV Cloudflare preview HTTP

on:
  push:
    branches:
      - staging/lunatv-20261024
    paths:
      - .github/workflows/smoke-lunatv-staging.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify deployed LunaTV preview responds
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://1970d8c2.moontv-6en.pages.dev"
          for path in "/" "/login" "/favicon.ico" "/api/server-config"; do
            echo "CHECK_URL=$ROOT$path"
            curl --location --silent --show-error --max-time 30 --retry 2 --retry-delay 2 \
              -D /tmp/headers.txt -o /tmp/body.txt -w 'HTTP=%{http_code} TOTAL=%{time_total}\\n' "$ROOT$path" || :
            grep -Ei '^(HTTP/|server:|cf-ray:|content-type:|location:)' /tmp/headers.txt || :
            echo "body bytes: $(wc -c </tmp/body.txt)"
            head -c 450 /tmp/body.txt | tr '\\n' ' ' || :
            echo
          done
          echo "STAGING_DIAGNOSTICS_DONE"
