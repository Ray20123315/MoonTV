name: Verify LunaTV Cloudflare preview HTTP

on:
  push:
    branches:
      - staging/lunatv-20261024
    paths:
      - .github/workflows/smoke-lunatv-staging.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify deployed LunaTV preview responds
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://f20bce74.moontv-6en.pages.dev"
          for path in "/" "/login"; do
            code="$(curl --location --silent --show-error --max-time 30 --retry 2 --retry-delay 3 -o /tmp/page.html -w '%{http_code}' "$ROOT$path")"
            echo "CHECK $path HTTP=$code"
            test "$code" = "200"
            grep -Eqi '(MoonTV|LunaTV|login|登录|登入)' /tmp/page.html
          done
          echo "STAGING_HTTP_PASS: Node.js compatible Pages preview home and login"
