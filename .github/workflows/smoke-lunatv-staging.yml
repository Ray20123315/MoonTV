name: Verify MoonTV owner and user management rollback

on:
  push:
    branches:
      - staging/lunatv-20261024
    paths:
      - .github/workflows/smoke-lunatv-staging.yml

permissions:
  contents: read

jobs:
  verify-old-production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check MoonTV original production routes and D1 configuration
        shell: bash
        run: |
          set -euo pipefail
          for ROOT in "https://moontv.ray2026.dpdns.org" "https://moontv.ray2025mail.dpdns.org" "https://moontv-6en.pages.dev"; do
            echo "DOMAIN=$ROOT"
            for route in "/" "/login" "/admin" "/api/server-config" "/api/admin/config"; do
              code="$(curl --location --silent --show-error --max-time 25 --retry 1 --retry-delay 2 -D /tmp/headers.txt -o /tmp/page.txt -w '%{http_code}' "$ROOT$route")"
              echo "GET $route STATUS $code BYTES $(wc -c </tmp/page.txt)"
              if [ "$route" = "/" ] || [ "$route" = "/login" ]; then
                test "$code" = "200"
              fi
              if [ "$route" = "/api/server-config" ]; then
                test "$code" = "200"
                cat /tmp/page.txt | jq -e '.StorageType == "d1"'
              fi
              if [ "$route" = "/api/admin/config" ]; then
                test "$code" = "401"
              fi
              if [ "$route" = "/admin" ]; then
                case "$code" in 200|302|303|307|308|401|403) : ;; *) exit 1 ;; esac
              fi
            done
            echo "ROLLBACK_HTTP_PASS: $ROOT"
          done
