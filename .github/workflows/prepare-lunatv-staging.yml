name: Prepare LunaTV Cloudflare D1 staging

on:
  push:
    branches:
      - staging/lunatv-20261024
    paths:
      - .github/workflows/prepare-lunatv-staging.yml

permissions:
  contents: write

jobs:
  build-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/lunatv-20261024
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download canonical LunaTV and D1-compatible reference
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 https://github.com/MoonTechLab/LunaTV.git /tmp/lunatv-upstream
          git clone --quiet --depth=1 https://github.com/kzb12580/LunaTV-CF.git /tmp/lunatv-cf
          echo "UPSTREAM_COMMIT=$(git -C /tmp/lunatv-upstream rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CF_COMMIT=$(git -C /tmp/lunatv-cf rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Assemble isolated Cloudflare-compatible application
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, shutil
          root=pathlib.Path('.').resolve()
          ref=pathlib.Path('/tmp/lunatv-cf')
          upstream=pathlib.Path('/tmp/lunatv-upstream')
          original_config=(root/'config.json').read_bytes() if (root/'config.json').exists() else None
          for item in root.iterdir():
              if item.name in ('.git','.github'):
                  continue
              if item.is_dir():
                  shutil.rmtree(item)
              else:
                  item.unlink()
          for item in ref.iterdir():
              if item.name in ('.git','.github','wrangler.toml','config.json'):
                  continue
              dest=root/item.name
              if item.is_dir():
                  shutil.copytree(item,dest)
              else:
                  shutil.copy2(item,dest)
          if original_config is not None:
              (root/'config.json').write_bytes(original_config)
          elif (ref/'config.json').exists():
              shutil.copy2(ref/'config.json',root/'config.json')
          # Use the official 2026 upstream UI, while retaining the Pages Edge API
          # handlers and D1 storage bridge from the verified Cloudflare adapter.
          for relative in ('src/components','src/app'):
              src=upstream/relative
              dst=root/relative
              for path in src.rglob('*'):
                  if path.is_dir():
                      continue
                  rel=path.relative_to(src)
                  if relative=='src/app' and rel.parts[0]=='api':
                      continue
                  target=dst/rel
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(path,target)
          # Next-on-Pages requires all dynamic pages to opt into Edge Runtime.
          root_layout=root/'src/app/layout.tsx'
          layout=root_layout.read_text(encoding='utf-8')
          if "export const runtime = 'edge';" not in layout:
              layout=layout.replace("export const dynamic = 'force-dynamic';", "export const runtime = 'edge';" + chr(10) + "export const dynamic = 'force-dynamic';")
              root_layout.write_text(layout,encoding='utf-8')
          # Disable obsolete fork-sync automation targeting another project.
          (root/'.github/workflows/sync.yml').unlink(missing_ok=True)
          (root/'.github/workflows/nomore-spam.yml').unlink(missing_ok=True)
          (root/'.github/workflows/docker-image.yml').unlink(missing_ok=True)
          # Document exact provenance for follow-up diff/merge work.
          (root/'CLOUDFLARE_PORT.md').write_text(
              '# LunaTV Cloudflare D1 port\n'
              'Code basis: MoonTechLab/LunaTV UI plus kzb12580/LunaTV-CF Pages/D1 adapter.\n'
              'Original private D1 data stays in the original Cloudflare database, not in Git.\n'
              'The standalone Pages project continues using DB and the original environment variables.\n'
              'Official upstream commit: '+os.environ['UPSTREAM_COMMIT']+'\n'
              'Reference adapter commit: '+os.environ['CF_COMMIT']+'\n'
              'The upstream Node.js migration endpoints are deliberately excluded from the Edge build.\n',
              encoding='utf-8'
          )
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build Cloudflare Pages output
        run: pnpm run pages:build
      - name: Commit built and verified staging source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "stage: port LunaTV to Cloudflare Pages with D1 persistence"
          git push origin HEAD:staging/lunatv-20261024
          echo "STAGING_BUILD_PASS: Cloudflare Pages build and D1 adapter typecheck"
